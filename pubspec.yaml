name: roti_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  sqflite_sqlcipher: ^2.2.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  intl: 0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter

  # ── نظام الترخيص ──────────────────────────
  file_picker: ^10.1.9
  share_plus: ^10.1.4
  uuid: ^4.5.1
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.webp

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.webp"
